<!-- Form Section -->
<div class="bg-white shadow-lg px-6 py-4 fixed bottom-0 left-0 right-0 border-t border-gray-200">
    <form id="category-form" (ngSubmit)="submitForm()" class="space-y-4 max-w-4xl mx-auto">
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
            <input
                    id="name"
                    type="text"
                    [(ngModel)]="categoryForm.name"
                    name="name"
                    class="block w-full p-2 border border-gray-300 rounded-md"
            />
        </div>
        <div>
            <label for="parentId" class="block text-sm font-medium text-gray-700">Parent Category</label>
            <select
                    id="parentId"
                    [(ngModel)]="categoryForm.parentId"
                    name="parentId"
                    class="block w-full p-2 border border-gray-300 rounded-md"
            >
                <option [value]="null">None</option>
                <option *ngFor="let category of categories" [value]="category.id">
                    {{ category.name }}
                </option>
            </select>
        </div>
        <div class="flex justify-end">
            <button
                    type="submit"
                    class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600"
            >
                {{ isEditMode ? 'Update Category' : 'Add Category' }}
            </button>
        </div>
    </form>
</div>
