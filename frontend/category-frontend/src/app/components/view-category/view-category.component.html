<div class="bg-gray-100 p-6 rounded-lg shadow-md">
  <h1 class="text-2xl font-bold text-gray-800 mb-4">Category Details</h1>

  <ul class="space-y-2">
    <li><strong>ID:</strong> {{ category?.id }}</li>
    <li><strong>Name:</strong> {{ category?.name }}</li>
    <li><strong>Created At:</strong> {{ category?.createdAt }}</li>
    <li>
      <strong>Parent ID:</strong> {{ category?.parentId || 'None' }}
    </li>
    <li><strong>Children Count:</strong> {{ category?.childrenIds?.length || 0 }}</li>
    <li><strong>Is Root:</strong> {{ category?.root ? 'Yes' : 'No' }}</li>
  </ul>

  <div class="mt-4">
    <button
      routerLink=""
      class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600"
    >
      Back to List
    </button>
  </div>
</div>
